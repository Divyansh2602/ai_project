<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="926" viewBox="0 0 1120 926" font-family="Arial, Helvetica, sans-serif">
<rect width="1120" height="926" fill="white"/>
<text x="560.0" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f1b2d">Sequence diagram: analysing one image</text>
<rect x="20" y="62" width="140" height="42" rx="8" fill="#e2f0ff" stroke="#0b3b6f" stroke-width="1.6"/>
<text x="90" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f1b2d">Analyst</text>
<line x1="90" y1="104" x2="90" y2="906" stroke="#aab6c6" stroke-width="1.4" stroke-dasharray="6 5"/>
<rect x="200" y="62" width="140" height="42" rx="8" fill="#e2f0ff" stroke="#0b3b6f" stroke-width="1.6"/>
<text x="270" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f1b2d">Web app</text>
<line x1="270" y1="104" x2="270" y2="906" stroke="#aab6c6" stroke-width="1.4" stroke-dasharray="6 5"/>
<rect x="380" y="62" width="140" height="42" rx="8" fill="#e2f0ff" stroke="#0b3b6f" stroke-width="1.6"/>
<text x="450" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f1b2d">FastAPI</text>
<line x1="450" y1="104" x2="450" y2="906" stroke="#aab6c6" stroke-width="1.4" stroke-dasharray="6 5"/>
<rect x="560" y="62" width="140" height="42" rx="8" fill="#e2f0ff" stroke="#0b3b6f" stroke-width="1.6"/>
<text x="630" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f1b2d">Agents</text>
<line x1="630" y1="104" x2="630" y2="906" stroke="#aab6c6" stroke-width="1.4" stroke-dasharray="6 5"/>
<rect x="740" y="62" width="140" height="42" rx="8" fill="#e2f0ff" stroke="#0b3b6f" stroke-width="1.6"/>
<text x="810" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f1b2d">Decision engine</text>
<line x1="810" y1="104" x2="810" y2="906" stroke="#aab6c6" stroke-width="1.4" stroke-dasharray="6 5"/>
<rect x="920" y="62" width="140" height="42" rx="8" fill="#e2f0ff" stroke="#0b3b6f" stroke-width="1.6"/>
<text x="990" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f1b2d">Evidence store</text>
<line x1="990" y1="104" x2="990" y2="906" stroke="#aab6c6" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="180.0" y="170" text-anchor="middle" font-size="13.5" fill="#0f1b2d">1. choose and submit image</text>
<line x1="90" y1="182" x2="257" y2="182" stroke="#5b6b80" stroke-width="1.8"/>
<polygon points="268,182 255,176.5 255,187.5" fill="#5b6b80"/>
<text x="360.0" y="232" text-anchor="middle" font-size="13.5" fill="#0f1b2d">2. POST /api/upload</text>
<line x1="270" y1="244" x2="437" y2="244" stroke="#5b6b80" stroke-width="1.8"/>
<polygon points="448,244 435,238.5 435,249.5" fill="#5b6b80"/>
<text x="720.0" y="294" text-anchor="middle" font-size="13.5" fill="#0f1b2d">3. hash and store file</text>
<line x1="450" y1="306" x2="977" y2="306" stroke="#5b6b80" stroke-width="1.8"/>
<polygon points="988,306 975,300.5 975,311.5" fill="#5b6b80"/>
<text x="540.0" y="356" text-anchor="middle" font-size="13.5" fill="#0f1b2d">4. run metadata, image, provenance</text>
<line x1="450" y1="368" x2="617" y2="368" stroke="#5b6b80" stroke-width="1.8"/>
<polygon points="628,368 615,362.5 615,373.5" fill="#5b6b80"/>
<text x="648" y="418" text-anchor="start" font-size="13.5" fill="#0f1b2d">5. trained detector, ELA, Grad-CAM</text>
<rect x="622" y="424" width="16" height="40" fill="#e2f0ff" stroke="#0b3b6f" stroke-width="1.4"/>
<text x="720.0" y="480" text-anchor="middle" font-size="13.5" fill="#0f1b2d">6. agent scores</text>
<line x1="630" y1="492" x2="797" y2="492" stroke="#5b6b80" stroke-width="1.8"/>
<polygon points="808,492 795,486.5 795,497.5" fill="#5b6b80"/>
<text x="630.0" y="542" text-anchor="middle" font-size="13.5" fill="#0f1b2d">7. verdict and reasoning</text>
<line x1="810" y1="554" x2="463" y2="554" stroke="#5b6b80" stroke-width="1.8" stroke-dasharray="7 5"/>
<polygon points="452,554 465,548.5 465,559.5" fill="#5b6b80"/>
<text x="720.0" y="604" text-anchor="middle" font-size="13.5" fill="#0f1b2d">8. sign and save record</text>
<line x1="450" y1="616" x2="977" y2="616" stroke="#5b6b80" stroke-width="1.8"/>
<polygon points="988,616 975,610.5 975,621.5" fill="#5b6b80"/>
<text x="360.0" y="666" text-anchor="middle" font-size="13.5" fill="#0f1b2d">9. file_id</text>
<line x1="450" y1="678" x2="283" y2="678" stroke="#5b6b80" stroke-width="1.8" stroke-dasharray="7 5"/>
<polygon points="272,678 285,672.5 285,683.5" fill="#5b6b80"/>
<text x="360.0" y="728" text-anchor="middle" font-size="13.5" fill="#0f1b2d">10. GET /api/report and /api/verify</text>
<line x1="270" y1="740" x2="437" y2="740" stroke="#5b6b80" stroke-width="1.8"/>
<polygon points="448,740 435,734.5 435,745.5" fill="#5b6b80"/>
<text x="360.0" y="790" text-anchor="middle" font-size="13.5" fill="#0f1b2d">11. report JSON, verification</text>
<line x1="450" y1="802" x2="283" y2="802" stroke="#5b6b80" stroke-width="1.8" stroke-dasharray="7 5"/>
<polygon points="272,802 285,796.5 285,807.5" fill="#5b6b80"/>
<text x="180.0" y="852" text-anchor="middle" font-size="13.5" fill="#0f1b2d">12. verdict, heatmaps, evidence PDF</text>
<line x1="270" y1="864" x2="103" y2="864" stroke="#5b6b80" stroke-width="1.8" stroke-dasharray="7 5"/>
<polygon points="92,864 105,858.5 105,869.5" fill="#5b6b80"/>
</svg>